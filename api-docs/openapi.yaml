      operationId: postPortalSolicitudesCrear
      tags: [Portal]
      summary: Crear solicitud desde el portal
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key` · No permite tipo=ticket."
