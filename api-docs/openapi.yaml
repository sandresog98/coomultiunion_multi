components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <secreto>"
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "Alternativa a Authorization"
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: "UUID único por intento (evita duplicados)"
    ActingAsCedula:
      name: X-Acting-As-Cedula
      in: header
      required: false
      schema: { type: string }
      description: "Cédula a impersonar (requiere scope portal.actuar)"
  schemas:
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
        data: {}
    RowsList:
      type: object
      description: Envoltura estándar de listados paginados.
      properties:
        ok: { type: boolean, example: true }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { type: object, additionalProperties: true }
            total: { type: integer, example: 128 }
            limit: { type: integer, example: 20 }
            offset: { type: integer, example: 0 }
    ObjectData:
      type: object
      description: Envoltura estándar de recurso único (detalle / obtener).
      properties:
        ok: { type: boolean, example: true }
        data: { type: object, additionalProperties: true }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }
  responses:
    Ok:
      description: Operación exitosa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ok' }
    OkRows:
      description: Listado paginado exitoso (`{ rows, total, limit, offset }`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RowsList' }
    OkData:
      description: Recurso único exitoso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ObjectData' }
    BadRequest:
      description: Datos inválidos o falta X-Idempotency-Key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { ok: false, error: "Falta header X-Idempotency-Key para operaciones de mutación." }
    Unauthorized:
      description: Sin token / token inválido, revocado o expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { ok: false, error: "Token inválido" }
    Forbidden:
      description: Token válido sin permiso (rol/allowlist/scopes) o requiere HTTPS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { ok: false, error: "Token sin permiso para esta operación" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotencia en uso / operación en proceso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit por token excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { ok: false, error: "Límite de solicitudes excedido. Intente de nuevo en unos segundos." }
