    description: Pruebas (test)
  - url: https://coomultiunion.andapps.cloud/multi/api
    description: Producción
tags:
  - name: Health
    description: Diagnóstico y disponibilidad del servicio.
  - name: Solicitudes
    description: Solicitudes internas (staff) y PQRS/trámites del portal.
  - name: Portal
    description: Datos y acciones del asociado (requiere impersonación con X-Acting-As-Cedula).
  - name: Asociados
    description: Búsqueda de asociados y gestión de productos/cláusulas asignados.
  - name: Cobranza
    description: Comunicaciones, indagaciones y compromisos de pago.
  - name: Pagos
    description: Conciliación y confirmación de pagos (PSE/Confiar) y comprobantes.
  - name: Movimientos
    description: Movimientos contables y catálogo de tipos.
  - name: Cargas
    description: Procesamiento de archivos Sifone (.xls/.xlsx).
  - name: Créditos
    description: Solicitudes de crédito y gestión del expediente.
  - name: Tienda
    description: Catálogo, clientes, compras y ventas de la tienda.
  - name: Convenios
    description: Convenios y productos (administración).
  - name: Boletas
    description: Stock, venta y contabilización de boletas.
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /ping.php:
    get:
      operationId: getPing
      tags: [Health]
      summary: Ping/pong (health check)
      description: "Público. Si se envía un Bearer, lo valida (401 si es inválido/expirado). — **Restricciones.** Público. Con Bearer válido audita el uso."
      security: []
      x-actor: public
      x-required-scopes: []
      x-idempotent: false
      x-restrictions: "Público. Con Bearer válido audita el uso."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      operationId: postPing
      tags: [Health]
      summary: Ping/pong (health check)
      description: "Igual que GET. — **Restricciones.** Público. Con Bearer válido audita el uso."
      security: []
      x-actor: public
      x-required-scopes: []
      x-idempotent: false
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /solicitudes/crear.php:
    post:
      operationId: postSolicitudesCrear
      tags: [Solicitudes]
      summary: Crear solicitud (ticket staff o PQRS/boleta/redención/certificado/actualizar info del portal)
      description: |
        - **Staff** (`cedula_solicitante` = id de usuario interno): puede crear cualquier tipo.
          Para `tipo=ticket` exige `responsable_id` y el scope `solicitudes.gestion.crear_ticket`.
        - **Portal/impersonación** (`X-Acting-As-Cedula`): la cédula del actor manda; **no** puede crear `ticket`.
        
        **Restricciones.** Scope: `solicitudes.gestion.crear_ticket`, `portal.actuar` · Módulo: `solicitudes` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key` · - tipo=ticket: requiere responsable_id; el portal NO puede crear tickets. - tipo=boleta + metodo_pago=qr: exige archivo (multipart). - tipo=boleta + metodo_pago=credito: valida elegibilidad y límite. - multipart si se adjuntan archivos (`files[]`).
      x-actor: both
      x-required-scopes:
        - solicitudes.gestion.crear_ticket
        - portal.actuar
      x-module-gate: solicitudes
      x-idempotent: true
      x-restrictions: |
        - tipo=ticket: requiere responsable_id; el portal NO puede crear tickets.
        - tipo=boleta + metodo_pago=qr: exige archivo (multipart).
        - tipo=boleta + metodo_pago=credito: valida elegibilidad y límite.
        - multipart si se adjuntan archivos (`files[]`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActingAsCedula'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { type: string, enum: [ticket, pqrs, boleta, redencion, retiro_incentivos, certificado, actualizar_info, fondo, nuevo_producto, retiro_aporte] }
                cedula_solicitante: { type: string, description: "Staff: id de usuario interno solicitante" }
                responsable_id: { type: integer, description: "Solo ticket (staff)" }
                detalle:
                  type: object
                  additionalProperties: true
            example:
              tipo: ticket
              cedula_solicitante: "1"
              responsable_id: 2
              detalle: { categoria_id: 1, resumen: "Alto de impresora", descripcion: "..." }
          multipart/form-data:
            schema:
              type: object
              properties:
                tipo: { type: string }
                cedula_solicitante: { type: string }
                responsable_id: { type: integer }
                detalle: { type: string, description: "JSON serializado" }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /solicitudes/listar.php:
    get:
      operationId: getSolicitudesListar
      tags: [Solicitudes]
      summary: Listar solicitudes
      description: "Staff: todas (con filtros). Portal/impersonación: solo la cédula actuada. — **Restricciones.** Scope: `solicitudes`, `portal.actuar` · Módulo: `solicitudes` · Requiere `X-Acting-As-Cedula` · Portal: fuerza cédula del actor. Staff: permite `?cedula=`."
      x-actor: both
      x-required-scopes: [solicitudes, portal.actuar]
      x-module-gate: solicitudes
      x-idempotent: false
      x-restrictions: "Portal: fuerza cédula del actor. Staff: permite `?cedula=`."
      parameters:
        - $ref: '#/components/parameters/ActingAsCedula'
        - { name: tipo, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { type: string } }
        - { name: fase, in: query, schema: { type: string } }
        - { name: responsable, in: query, schema: { type: integer } }
        - { name: cedula, in: query, schema: { type: string }, description: "Solo staff" }
        - { name: radicado, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/OkRows' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /solicitudes/detalle.php:
    get:
      operationId: getSolicitudesDetalle
      tags: [Solicitudes]
      summary: Detalle de una solicitud
      description: "**Restricciones.** Scope: `solicitudes`, `portal.actuar` · Módulo: `solicitudes` · Requiere `X-Acting-As-Cedula` · Portal: solo si la solicitud pertenece a la cédula actuada (si no, 403)."
      x-actor: both
      x-required-scopes: [solicitudes, portal.actuar]
      x-module-gate: solicitudes
      x-idempotent: false
      x-restrictions: "Portal: solo si la solicitud pertenece a la cédula actuada (si no, 403)."
      parameters:
        - $ref: '#/components/parameters/ActingAsCedula'
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OkData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /solicitudes/comentar.php:
    post:
      operationId: postSolicitudesComentar
      tags: [Solicitudes]
      summary: Comentar una solicitud (opcionalmente con adjuntos)
      description: "**Restricciones.** Scope: `solicitudes`, `portal.actuar` · Módulo: `solicitudes` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key` · Portal: solo sus solicitudes. Staff necesita scope/acción de comentar cuando aplica."
      x-actor: both
      x-required-scopes: [solicitudes, portal.actuar]
      x-module-gate: solicitudes
      x-idempotent: true
      x-restrictions: "Portal: solo sus solicitudes. Staff necesita scope/acción de comentar cuando aplica."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActingAsCedula'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, mensaje]
              properties:
                id: { type: integer }
                mensaje: { type: string }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /solicitudes/adjuntar.php:
    post:
      operationId: postSolicitudesAdjuntar
      tags: [Solicitudes]
      summary: Adjuntar archivo a una solicitud
      description: "**Restricciones.** Scope: `solicitudes`, `portal.actuar` · Módulo: `solicitudes` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key` · Multipart. Portal: solo sus solicitudes."
      x-actor: both
      x-required-scopes: [solicitudes, portal.actuar]
      x-module-gate: solicitudes
      x-idempotent: true
      x-restrictions: "Multipart. Portal: solo sus solicitudes."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActingAsCedula'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, file]
              properties:
                id: { type: integer }
                file: { type: string, format: binary }
                contexto: { type: string, default: solicitud }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /solicitudes/transicion.php:
    post:
      operationId: postSolicitudesTransicion
      tags: [Solicitudes]
      summary: Transicionar el estado de una solicitud
      description: "**Restricciones.** Scope: `solicitudes`, `portal.actuar` · Módulo: `solicitudes` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key` · Staff: scope de acción. Portal: solo sus solicitudes (no retiro_aporte)."
      x-actor: both
      x-required-scopes: [solicitudes, portal.actuar]
      x-module-gate: solicitudes
      x-idempotent: true
      x-restrictions: "Staff: scope de acción. Portal: solo sus solicitudes (no retiro_aporte)."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActingAsCedula'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, estado_destino]
              properties:
                id: { type: integer }
                estado_destino: { type: string }
                comentario: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/convenios.php:
    get:
      operationId: getPortalConvenios
      tags: [Portal]
      summary: Catálogo de convenios/productos del asociado
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula` · Requiere X-Acting-As-Cedula (si no, 401)."
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: false
      x-restrictions: "Requiere X-Acting-As-Cedula (si no, 401)."
      parameters: [{ $ref: '#/components/parameters/ActingAsCedula' }]
      responses:
        '200': { $ref: '#/components/responses/OkRows' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/aportes.php:
    get:
      operationId: getPortalAportes
      tags: [Portal]
      summary: Saldos/resumen de aportes del asociado
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula` · Requiere X-Acting-As-Cedula."
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: false
      x-restrictions: "Requiere X-Acting-As-Cedula."
      parameters: [{ $ref: '#/components/parameters/ActingAsCedula' }]
      responses:
        '200': { $ref: '#/components/responses/OkData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/extractos.php:
    get:
      operationId: getPortalExtractos
      tags: [Portal]
      summary: Extractos del asociado
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula`"
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: false
      parameters: [{ $ref: '#/components/parameters/ActingAsCedula' }]
      responses:
        '200': { $ref: '#/components/responses/OkRows' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/movimientos.php:
    get:
      operationId: getPortalMovimientos
      tags: [Portal]
      summary: Movimientos del asociado
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula`"
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: false
      parameters: [{ $ref: '#/components/parameters/ActingAsCedula' }]
      responses:
        '200': { $ref: '#/components/responses/OkRows' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/creditos.php:
    get:
      operationId: getPortalCreditos
      tags: [Portal]
      summary: Créditos del asociado
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula`"
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: false
      parameters: [{ $ref: '#/components/parameters/ActingAsCedula' }]
      responses:
        '200': { $ref: '#/components/responses/OkRows' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/creditos_detalle.php:
    get:
      operationId: getPortalCreditosDetalle
      tags: [Portal]
      summary: Detalle de crédito del asociado
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula`"
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: false
      parameters:
        - $ref: '#/components/parameters/ActingAsCedula'
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OkData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/solicitud_calificar.php:
    post:
      operationId: postPortalSolicitudCalificar
      tags: [Portal]
      summary: Calificar la atención de una solicitud
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key` · Solo solicitudes del asociado actuado."
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: true
      x-restrictions: "Solo solicitudes del asociado actuado."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActingAsCedula'
