      operationId: postPortalFondoSolicitar
      tags: [Portal]
      summary: Solicitar un convenio de Fondo de Bienestar
      description: "**Restricciones.** Scope: `portal.actuar` · Requiere `X-Acting-As-Cedula` · Requiere `X-Idempotency-Key`"
      x-actor: portal
      x-required-scopes: [portal.actuar]
      x-idempotent: true
      parameters:
