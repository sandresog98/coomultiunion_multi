openapi: 3.0.3
info:
  title: Multi App v2 — API por tokens
  version: 1.0.0
  description: |
    Contrato de la API autenticada por **token Bearer** para integraciones externas (curl/Postman).

    ## Cómo obtener un token
    **Solicita un token a un administrador.** Te entregará el secreto (se muestra una
    sola vez) con su vigencia y los permisos (scopes) correspondientes. Para rotarlo o
    revocarlo, vuelve a solicitarlo a un administrador.

    ## Autenticación
    - `Authorization: Bearer <secreto>` (o `X-Api-Key: <secreto>`).
    - Peticiones stateless: **no** usan cookie y **no** requieren CSRF.
    - En producción se exige **HTTPS**.
    - Mutadores (POST/PUT/DELETE): envía `X-Idempotency-Key` (UUID único por intento).

    ## Autorización (3 capas)
    Una operación se permite solo si:
    `rol del usuario del token` ∧ `clave ∈ endpoints autorizados (allowlist)` ∧ `clave ∈ scopes del token`.

    Cada operación declara:
    - `x-required-scopes`: scopes que la habilitan (cualquiera de la lista).
    - `x-module-gate`: módulo RBAC que el rol debe tener (si difiere del prefijo).
    - `x-actor`: `staff`, `portal`, `both` o `public`.
    - `x-idempotent`: si exige `X-Idempotency-Key`.
    - `x-restrictions`: restricciones adicionales del endpoint.

    Estos metadatos se muestran como una tabla **Campo/Valor** al final de la
    descripción de cada operación (actor, scopes, módulo-gate, idempotencia y notas).

    ## Impersonación (portal)
    Un token con el scope especial `portal.actuar` **y** el header
    `X-Acting-As-Cedula: <cédula>` opera como ese asociado (aislado por cédula y auditado).
    Sin el header: `portal/*` → 401 y `solicitudes/*` → 403.

    ## Cómo encontrar el `id` (descubrimiento)
    Los mutadores (POST/PUT/DELETE) reciben el `id` del recurso. Para obtenerlo:
    1. `GET /<módulo>/listar?q=<clave natural>` (o un filtro específico: `cedula`, `radicado`, `serial`).
    2. La respuesta trae `{ rows: [...], total, limit, offset }`; cada fila incluye `id` y sus claves naturales.
    3. Usa ese `id` en el mutador.

    `q` busca por claves naturales según el módulo: cédula/nombre, serial/factura,
    número de solicitud, radicado, etc.

    ## Convención de métodos (importante)
    - **POST** se usa para crear **y** para actualizar/accionar en los módulos con
      multiplexor (`?action=` / `accion=`): **tienda, convenios, créditos y boletas**.
      En esos módulos **no hay `PUT`**: se actualiza con `POST` (`id>0` → editar, o `accion=...`).
    - **PUT** se usa para editar en **cobranza, movimientos, asociados/productos** y
      **pagos** (`confirmar.php`).
    - **DELETE** se usa para desasignar/eliminar donde el endpoint lo expone.

    ## Límites y errores
    Formato: `{"ok":false,"error":"..."}`

    | HTTP | Significado |
    |---|---|
    | 400 | Datos inválidos o falta `X-Idempotency-Key` |
    | 401 | Sin token / token inválido, revocado o expirado |
    | 403 | Token válido sin permiso (rol/allowlist/scopes) o requiere HTTPS |
    | 405 | Método HTTP no permitido |
    | 409 | Clave idempotente en uso / operación en proceso |
    | 429 | Rate limit por token excedido |

    ## Variables de entorno
    ```ini
    API_TOKEN_ENABLED=1
    API_TOKEN_DIAS_DEFAULT=180
    API_TOKEN_MAX_DIAS=365
    API_TOKEN_HTTPS_ONLY=0
    API_TOKEN_RATE_MAX=120
    API_TOKEN_RATE_WINDOW=60
    ```

    ## Seguridad
    - Secreto de 32 bytes; almacenado solo como SHA-256; se muestra una vez.
    - Expiración obligatoria + revocación + rotación; usuario y rol resueltos en vivo.
    - Auditoría en `logs` (prefijo, usuario, método y ruta) y rate limit por token.
    - La gestión de tokens no se realiza con la propia API.
